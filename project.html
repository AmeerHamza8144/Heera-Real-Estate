<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Havenly project details." />
  <title>Heera Estate | Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="project.css" />
</head>
<body class="project-body">
  <header class="project-header">
    <div class="project-header-inner">
      <a class="brand" href="#top" aria-label="Havenly home">
        <span class="brand-logo"><img src="images/home-logo.jpg" alt="Heera Estate logo" /></span>
        <span>Heera Estate</span>
      </a>
      <a class="project-back-link" href="index.html">← Back to projects</a>
    </div>
  </header>
  <main id="projectContent">
    <section class="project-hero" id="projectHero">
      <div class="project-hero-inner"><p class="eyebrow light" id="projectCategory">Project</p><h1 id="projectTitle">Loading project…</h1><p class="project-location" id="projectLocation"></p></div>
    </section>
    <section class="project-overview section">
      <div><p class="eyebrow">About the project</p><h2 id="projectHeadline">A thoughtful place to live</h2></div>
      <div class="project-copy"><p id="projectDescription"></p><dl class="project-facts" id="projectFacts"></dl></div>
    </section>
    <section class="project-plans section" id="plansSection">
      <div class="section-heading"><div><p class="eyebrow">Plans</p><h2>Explore the layouts</h2></div></div>
      <div class="plans-grid" id="projectPlans"></div>
    </section>
    <section class="project-gallery section">
      <div class="section-heading"><div><p class="eyebrow">Gallery</p><h2>Inside the project</h2></div></div>
      <div class="project-gallery-grid" id="projectGallery"></div>
    </section>
  </main>
  <section class="project-not-found section" id="projectNotFound" hidden><p class="eyebrow">Project not found</p><h2>We couldn’t find that project.</h2><a class="button button-dark" href="index.html">Return home <span>→</span></a></section>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">H</span><span>Heera Estates</span></a><p>Homes that feel like home.</p><span>© <span id="year"></span> Heera Real Estate</span></footer>
  <script src="project.js"></script>
</body>
</html>
